[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbc-matrix-audit"
version = "1.2.0"
description = "Audit and inspect DBC communication matrices (CAN / CAN FD). Zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "autosar-agent-skills contributors" }]
keywords = ["autosar", "can", "canfd", "dbc", "communication-matrix", "lint", "embedded"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
dbc-analyze = "dbc_analyze:main"

[tool.setuptools]
py-modules = ["dbc_analyze"]

[tool.setuptools.package-dir]
"" = "skills/dbc-matrix-audit/scripts"

[tool.ruff]
line-length = 110
target-version = "py310"
