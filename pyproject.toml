[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbc-matrix-audit"
version = "1.3.1"
description = "Zero-dependency DBC / ARXML auditor for AUTOSAR and CAN (FD): 11 matrix checks, revision diff, frame decoding, 26 ARXML-vs-DBC cross-checks."
readme = "README.en.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Harry Zhao", email = "tech.harry.zhao@gmail.com" }]
maintainers = [{ name = "Harry Zhao", email = "tech.harry.zhao@gmail.com" }]
keywords = [
  "autosar", "can", "canfd", "dbc", "arxml", "ecu",
  "communication-matrix", "lint", "static-analysis", "embedded", "agent-skills",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Embedded Systems",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
dbc-analyze = "dbc_analyze:main"
arxml-dbc-check = "arxml_dbc_check:main"

[project.urls]
Homepage = "https://autosar-skills.github.io/autosar-agent-skills/"
Documentation = "https://autosar-skills.github.io/autosar-agent-skills/"
Repository = "https://github.com/autosar-skills/autosar-agent-skills"
Changelog = "https://github.com/autosar-skills/autosar-agent-skills/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/autosar-skills/autosar-agent-skills/issues"
"Design write-up" = "https://me.tech-harry.top/blog/dbc-matrix-audit-skill.en.html"
"Debugging story" = "https://me.tech-harry.top/blog/arxml-dbc-consistency.en.html"

[tool.setuptools]
py-modules = ["dbc_analyze", "arxml_dbc_check"]

[tool.setuptools.package-dir]
"" = "skills/dbc-matrix-audit/scripts"

[tool.ruff]
line-length = 110
target-version = "py38"
